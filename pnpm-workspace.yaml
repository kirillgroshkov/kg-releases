minimumReleaseAgeExclude:
  - '@naturalcycles/*'
  - vitest
  - '@vitest/*'
  - oxfmt
  - '@oxfmt/*'
  - eslint-plugin-oxlint
  - oxlint
  - oxlint-tsgolint
  - '@oxlint/*'

optimisticRepeatInstall: false
overrides:
  typescript: ~6.0

blockExoticSubdeps: true

publicHoistPattern:
  - oxlint
  - oxlint-tsgolint
  - oxfmt
allowBuilds:
  esbuild: true
  '@firebase/util': false
  '@parcel/watcher': false
  protobufjs: false

trustLockfile: true
trustPolicyExcludePrune: true
trustPolicy: no-downgrade

update:
  githubActions: false
